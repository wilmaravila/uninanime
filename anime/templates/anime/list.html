{% load static %}

<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'anime/list.css' %}">
</head>

<body>

<h1 class="title">Anime Library</h1>

<div class="grid">

    {% for anime in animes %}
    <a href="{% url 'anime_detail' anime.id %}" class="card">

        <div class="poster">
            <img src="{{ anime.poster_url }}">
        </div>

        <div class="info">
            <h3>{{ anime.title }}</h3>
            <p>{{ anime.release_year }}</p>
        </div>

    </a>
    {% endfor %}

</div>

</body>
</html>
