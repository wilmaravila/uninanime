{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Library</title>
    <link rel="stylesheet" href="{% static 'anime/list.css' %}">
</head>
<body>

    <div class="header-container">
        <h1 class="title">Anime Library</h1>
        <a href="#" class="btn-add-anime">+ Agregar Anime</a>
    </div>

    <div class="grid">
        {% for anime in animes %}
        <div class="card">
            
            <a href="#" class="btn-edit" title="Editar Anime">✏️</a>

            <a href="{% url 'anime_detail' anime.id %}" class="card-link">
                <div class="poster">
                    <img src="{{ anime.poster_url }}" alt="{{ anime.title }}" onerror="this.onerror=null; this.src='{% static 'anime/images/default_poster.jpg' %}';">
                </div>

                <div class="info">
                    <h3>{{ anime.title }}</h3>
                    <p>{{ anime.release_year }}</p>
                </div>
            </a>
            
        </div>
        {% endfor %}
    </div>

</body>
</html>
