{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'comunidad/css/nueva.css' %}">
{% endblock %}

{% block title %}Eliminar publicación{% endblock %}

{% block content %}
<div class="form-wrapper" style="max-width:520px;margin:60px auto;text-align:center;">

  <h2 style="color:#ef4444;font-size:1.8rem;margin-bottom:16px;">
    ¿Eliminar publicación?
  </h2>

  <p style="color:var(--text-muted);margin-bottom:32px;line-height:1.6;">
    Estás a punto de eliminar
    <strong style="color:var(--text-main);">"{{ pub.titulo }}"</strong>.
    <br>Esta acción no se puede deshacer.
  </p>

  <form method="POST" style="display:flex;gap:12px;justify-content:center;">
    {% csrf_token %}

    <a href="{% url 'com_detalle' pub.pk %}"
       style="padding:14px 28px;border:1px solid var(--border-color);
              border-radius:10px;color:var(--text-muted);text-decoration:none;
              font-size:13px;font-weight:600;letter-spacing:1px;">
      Cancelar
    </a>

    <button type="submit"
            style="padding:14px 28px;background:#ef4444;color:#fff;
                   border:none;border-radius:10px;cursor:pointer;
                   font-size:13px;font-weight:700;letter-spacing:1px;
                   text-transform:uppercase;">
      Sí, eliminar
    </button>
  </form>
</div>
{% endblock %}
